services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: akama-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=akama
      - POSTGRES_PASSWORD=akama
      - POSTGRES_DB=akama
    volumes:
      - akama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akama"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: akama-ollama
    restart: unless-stopped
    volumes:
      - akama-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  akama:
    build:
      context: .
      args:
        CACHEBUST: 
    container_name: akama
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - POSTGRES_URL=postgres://akama:akama@postgres:5432/akama
      - OLLAMA_URL=http://ollama:11434
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
    volumes:
      - /home/jullury/tmp/opencode/container-akama/.akama:/home/worker/.akama
      - akama-workspaces:/home/worker/workspaces

volumes:
  akama-pgdata:
  akama-workspaces:
  akama-ollama:
